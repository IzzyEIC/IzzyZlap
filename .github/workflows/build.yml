name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZLAP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu ZLAP_KEYSTORE_BASE64 – dodaj go w Settings → Secrets and variables → Actions (instrukcja w README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zlap.p12"

      - name: Build
        env:
          ZLAP_KEYSTORE: ${{ runner.temp }}/zlap.p12
          ZLAP_KEYSTORE_PASSWORD: ${{ secrets.ZLAP_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Zlap-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Złap – wersja ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Na telefonie: pobierz plik `Zlap-${{ github.run_number }}.apk` poniżej i otwórz go, żeby zainstalować.
          files: Zlap-${{ github.run_number }}.apk
          make_latest: true
