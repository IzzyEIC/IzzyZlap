name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZLAP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Brak sekretu ZLAP_KEYSTORE_BASE64 – kompiluję, ale nie publikuję APK (instrukcja w README)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zlap.p12"
            echo "ZLAP_KEYSTORE=$RUNNER_TEMP/zlap.p12" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          ZLAP_KEYSTORE_PASSWORD: ${{ secrets.ZLAP_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      # Błędy kompilacji jako adnotacje – widoczne bez logowania do GitHuba
      - name: Report compile errors
        if: failure()
        run: grep -E "^e: |error:" build.log | head -20 | sed 's/^/::error::/' || true

      - name: Rename APK
        if: steps.key.outputs.present == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Zlap-${{ github.run_number }}.apk

      - name: Publish release
        if: steps.key.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Złap – wersja ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Na telefonie: pobierz plik `Zlap-${{ github.run_number }}.apk` poniżej i otwórz go, żeby zainstalować.
          files: Zlap-${{ github.run_number }}.apk
          make_latest: true
